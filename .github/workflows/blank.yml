name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/gaminghome
          mkdir -p app/src/main/res/layout

          echo "include ':app'" > settings.gradle

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.1.1"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.gaminghome'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.gaminghome"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="Gaming Home"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:clearTaskOnLaunch="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <GridView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/apps_grid"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              android:numColumns="4"
              android:horizontalSpacing="8dp"
              android:verticalSpacing="16dp"
              android:padding="16dp"
              android:stretchMode="columnWidth"/>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/gaminghome/MainActivity.java
          package com.example.gaminghome;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.AdapterView;
          import android.widget.BaseAdapter;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.text.TextUtils;
          import java.util.List;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  GridView appsGrid = findViewById(R.id.apps_grid);
                  final PackageManager pm = getPackageManager();
                  Intent intent = new Intent(Intent.ACTION_MAIN, null);
                  intent.addCategory(Intent.CATEGORY_LAUNCHER);
                  final List<ResolveInfo> apps = pm.queryIntentActivities(intent, 0);

                  appsGrid.setAdapter(new BaseAdapter() {
                      @Override
                      public int getCount() { return apps.size(); }
                      @Override
                      public Object getItem(int pos) { return apps.get(pos); }
                      @Override
                      public long getItemId(int pos) { return pos; }
                      @Override
                      public View getView(int pos, View view, ViewGroup parent) {
                          if (view == null) {
                              LinearLayout layout = new LinearLayout(MainActivity.this);
                              layout.setOrientation(LinearLayout.VERTICAL);
                              layout.setGravity(Gravity.CENTER);
                              layout.setPadding(8, 8, 8, 8);

                              ImageView icon = new ImageView(MainActivity.this);
                              icon.setLayoutParams(new LinearLayout.LayoutParams(120, 120));
                              icon.setScaleType(ImageView.ScaleType.FIT_CENTER);

                              TextView name = new TextView(MainActivity.this);
                              name.setTextColor(Color.WHITE);
                              name.setTextSize(12);
                              name.setMaxLines(1);
                              name.setEllipsize(TextUtils.TruncateAt.END);
                              name.setPadding(0, 10, 0, 0);

                              layout.addView(icon);
                              layout.addView(name);
                              view = layout;
                          }
                          
                          LinearLayout layout = (LinearLayout) view;
                          ImageView icon = (ImageView) layout.getChildAt(0);
                          TextView name = (TextView) layout.getChildAt(1);

                          ResolveInfo info = apps.get(pos);
                          icon.setImageDrawable(info.loadIcon(pm));
                          name.setText(info.loadLabel(pm));

                          return view;
                      }
                  });

                  appsGrid.setOnItemClickListener(new AdapterView.OnItemClickListener() {
                      @Override
                      public void onItemClick(AdapterView<?> parent, View view, int pos, long id) {
                          ResolveInfo info = apps.get(pos);
                          Intent launchIntent = pm.getLaunchIntentForPackage(info.activityInfo.packageName);
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(launchIntent);
                          }
                      }
                  });
              }
          }
          EOF

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.3'

      - name: Compile and Build APK
        run: gradle assembleDebug

      - name: Upload Final APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: GamingHome-APK
          path: app/build/outputs/apk/debug/app-debug.apk
